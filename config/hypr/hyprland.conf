# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
bind = $mod, T, exec, ghostty
bind = $mod, E, exec, thunar
bind = $mod, B, exec, brave

bind = Super, space, global, caelestia:launcher
#bindin = Super, catchall, global, caelestia:launcherInterrupt
bindin = Super, mouse:272, global, caelestia:launcherInterrupt
bindin = Super, mouse:273, global, caelestia:launcherInterrupt
bindin = Super, mouse:274, global, caelestia:launcherInterrupt
bindin = Super, mouse:275, global, caelestia:launcherInterrupt
bindin = Super, mouse:276, global, caelestia:launcherInterrupt
bindin = Super, mouse:277, global, caelestia:launcherInterrupt
bindin = Super, mouse_up, global, caelestia:launcherInterrupt
bindin = Super, mouse_down, global, caelestia:launcherInterrupt

# Misc
#bind = $kbSession, global, caelestia:session
#bindl = $kbClearNotifs, global, caelestia:clearNotifs
#bind = $kbShowPanels, global, caelestia:showall
#bind = $kbLock, global, caelestia:lock

# Restore lock
#bindl = $kbRestoreLock, exec, caelestia shell -d
#bindl = $kbRestoreLock, global, caelestia:lock

# Brightness
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media
bindl = Ctrl+Super, Space, global, caelestia:mediaToggle
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = Ctrl+Super, Equal, global, caelestia:mediaNext
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = Ctrl+Super, Minus, global, caelestia:mediaPrev
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# === Window Management ===
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod SHIFT, T, togglefloating
bind = $mod, W, togglegroup
bind = $mod, S, exec, ~/.config/hypr/scripts/focus-minimized.sh

# === Focus Navigation ===
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

#ind = $mod SHIFT, l, layoutmsg, movewindowto r
#ind = $mod SHIFT, h, layoutmsg, movewindowto l
#ind = $mod SHIFT, k, layoutmsg, movewindowto u
#ind = $mod SHIFT, j, layoutmsg, movewindowto d
#
#ind = $mod ALT, h, layoutmsg, swapcol r
#ind = $mod ALT, u, layoutmsg, swapcol l

# === Window Movement ===
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# === Column Navigation ===
bind = $mod, Home, focuswindow, first
bind = $mod, End, focuswindow, last

# === Monitor Navigation ===
#bind = $mod CTRL, left, focusmonitor, l
#bind = $mod CTRL, right, focusmonitor, r
#bind = $mod CTRL, H, focusmonitor, l
#bind = $mod CTRL, J, focusmonitor, d
#bind = $mod CTRL, K, focusmonitor, u
#bind = $mod CTRL, L, focusmonitor, r

# === Move to Monitor ===
#bind = $mod SHIFT CTRL, left, movewindow, mon:l
#bind = $mod SHIFT CTRL, down, movewindow, mon:d
#bind = $mod SHIFT CTRL, up, movewindow, mon:u
#bind = $mod SHIFT CTRL, right, movewindow, mon:r
#bind = $mod SHIFT CTRL, H, movewindow, mon:l
#bind = $mod SHIFT CTRL, J, movewindow, mon:d
#bind = $mod SHIFT CTRL, K, movewindow, mon:u
#bind = $mod SHIFT CTRL, L, movewindow, mon:r

# === Workspace Navigation ===
bind = $mod, Page_Down, workspace, e+1
bind = $mod, Page_Up, workspace, e-1
bind = $mod, U, workspace, e+1
bind = $mod, I, workspace, e-1
bind = $mod CTRL, down, movetoworkspace, e+1
bind = $mod CTRL, up, movetoworkspace, e-1
bind = $mod CTRL, U, movetoworkspace, e+1
bind = $mod CTRL, I, movetoworkspace, e-1

# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mod SHIFT, U, movetoworkspace, e+1
bind = $mod SHIFT, I, movetoworkspace, e-1

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod CTRL, mouse_down, movetoworkspace, e+1
bind = $mod CTRL, mouse_up, movetoworkspace, e-1

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# === Column Management ===
#ind = $mod, comma, layoutmsg, preselect l
#ind = $mod, bracketright, layoutmsg, preselect r
#ind = $mod SHIFT, minus, layoutmsg, colresize -0.2
#ind = $mod SHIFT, plus, layoutmsg, colresize +0.2

# === Sizing & Layout ===
#ind = $mod, R, layoutmsg, togglefit
#ind = $mod CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
#bindd = $mod, code:20, Expand window left, resizeactive, -100 0
#bindd = $mod, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod SHIFT, minus, resizeactive, 0 10%
binde = $mod SHIFT, plus, resizeactive, 10% 0
bind = $mod, minus, resizeactive, -10% 0
bind = $mod, plus, resizeactive, 0 -10%

# === Screenshots ===
bind = , XF86Launch1, exec, grimblast copy area
bind = CTRL, XF86Launch1, exec, grimblast copy screen
bind = ALT, XF86Launch1, exec, grimblast copy active
bind = , Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy screen
bind = ALT, Print, exec, grimblast copy active

# === System Controls ===
#bind = $mod SHIFT, P, dpms, off
#bind = $mod SHIFT, O, dpms, on

# === Floating Windows ===
windowrule = float 1, match:class (.*)
windowrule = size 65% 70%, match:float 1
windowrule = center 1, match:float 1
windowrule = border_size 2, match:float 1

# Dialogs y popups más pequeños
windowrule = size 50% 60%, match:title ^(Open|Save|Guardar|Abrir|File|Archivo)(.*)$
windowrule = center 1, match:title ^(Open|Save|Guardar|Abrir|File|Archivo)(.*)$

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$
windowrule = move 73% 72%, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
