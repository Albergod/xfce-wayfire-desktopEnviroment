# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,1

# ==================
# ENVIRONMENT VARS
# ==================
env = QT_QPA_PLATFORM,wayland
#env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,ghostty


 permission = /usr/(bin|local/bin)/grim, screencopy, allow
 permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
# ==================
# STARTUP  APPS
# ==================

exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = qs -c caelestia
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
#exec-once = mpvpaper -o "no-audio loop --profile=low-latency --framedrop=vo"

exec-once = hyprpm reload -n
# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = latam
    numlock_by_default = true
}

#gesture = 3, horizontal, workspace

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0  # off in niri
    
    col.active_border = rgba(707070ff)
    col.inactive_border = rgba(d0d0d0ff)
    
    layout = dwindle #scrolling
}


# ==================
# DECORATION
# ==================
decoration {
    rounding = 12
    
    active_opacity = 1.0
    inactive_opacity = 0.8
    
    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true
    bezier = curve,  0.68, -0.6, 0.32, 1.6
    bezier = movecurve, 0.34, 1.56, 0.64, 1

    animation = windows, 1, 4, curve
    animation = windowsIn, 1, 4, curve, popin 80%
    animation = windowsOut, 1, 6, curve, popin 80%
    animation = workspaces, 1, 4, default, slidefade
    animation = windowsMove, 1, 4, movecurve, slidefade 40%

    animation = fade, 1, 3, default
    animation = layersIn, 1, 7, default, popin 90%
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = false
    disable_splash_rendering = true
    vrr = 1
}

plugin {
    #overview { overrideAnimSpeed = true, dragAlpha = true workspaceActiveBackground = true}

    hyprbars {
        bar_height = 28
        bar_color = rgba(1e1e2eff)
        bar_text_size = 11
        bar_text_font = Sans
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_button_padding = 7

        # Botones (derecha a izquierda): cerrar, maximizar, minimizar
        hyprbars-button = rgb(ff4040), 14, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(40ff40), 14, , hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(ffaa00), 14, , hyprctl dispatch movetoworkspacesilent special:minimized
    }
}

